<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zarejestruj się</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-container">
        
        <div class="login-box card-style">
            <div style="display: flex; flex-direction: row; align-items: center; gap: 15px;">
                <a href="login.html"><i class="fa-solid fa-angle-left"></i></a>
                <h1 style="margin-bottom: 0px;">Utwórz konto</h1>
            </div><br>

            <form id="registerForm">
                <div class="form-group">
                        <label for="nameInput">Imię i nazwisko</label>
                        <div class="input-wrapper">
                        <input type="text" id="nameInput" placeholder="Jan Kowalski" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="emailInput">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailInput" placeholder="twoj@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Hasło</label>
                    <div class="input-wrapper">
                        <input type="password" id="passwordInput" placeholder="Co najmniej 6 znaków" required>
                        <i class="fa-regular fa-eye toggle-password" id="togglePasswordBtn" style="cursor: pointer;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordConfirmInput">Potwierdź hasło</label>
                    <div class="input-wrapper">
                        <input type="password" id="passwordConfirmInput" placeholder="********" required>
                    </div>
                </div>
                
                <div class = "password-strength">
                     <div class="strength-bar" id="strengthBar">
                         <div class="strength-fill" id="strengthFill"></div>
                     </div>
                     <small id="strengthText" style="font-size: 12px; color: #888;">Siła hasła</small>
                </div>
                <br>
                <div class="form-group">
                    <div style="width: 100%;">
                    <label class="checkbox-label" style="display: flex;flex-direction: row;">
                        <input type="checkbox" id="termsCheckbox" required style="margin-right: 5px;">
                        <a href="#" id="rules_checkbox">Akceptuję Regulamin</a>
                    </label>
                    </div>
                </div>
                <button type="submit" class="login-btn">Zarejestruj się</button>
            </form>

            <div class="login-footer">
                <p>Masz już konto? <a href="login.html">Zaloguj się</a></p>
            </div>
        </div> 
        <br>
        <footer class="simple-footer">
            <div class="links">
                <a href="#">Polityka Prywatności</a>
                <span class="sep">•</span>
                <a href="#">Regulamin</a>
                <span class="sep">•</span>
                <a href="#">Pomoc</a>
            </div>
            <p class="copyright">&copy; 2026 Twój Sklep. Wszelkie prawa zastrzeżone.</p>
        </footer>

    </div> 
    <script type="module" src="js/login.js"></script>
        <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>
</body>
</html>
