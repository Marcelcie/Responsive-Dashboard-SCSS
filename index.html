<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive-Dashboard</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="dashboard-grid">
        
        <header class="header">
            <div class="logo">Admin</div>
            <nav class="user-nav">
                <a href="#">Użytkownik</a>
                <button>Wyloguj</button>
            </nav>
        </header>

        <aside class="sidebar">
            <nav class="main-menu">
                <ul>
                    <li><a href="#" class="active">Pulpit</a></li>
                    <li><a href="#">Zarządzanie Podpisami</a></li>
                    <li><a href="#">Raporty</a></li>
                    <li><a href="#">Ustawienia</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            
            <section class="stats-cards">
                <h2>Przegląd</h2>
                <div class="card">Aktywne Reguły: 12</div> 
            </section>
            
            <section class="recent-activity">
                <h2>Ostatnie Zdarzenia</h2>
                </section>
            
        </main>

        <footer class="footer">
            <p>&copy; 2025 responsive dashboard</p>
        </footer>
    </div>
</body>
</html>
